name: Release

# Push a version tag (e.g. v0.11.0) and this builds the signed Windows
# installer, generates the updater manifest (latest.json), and publishes a
# GitHub release. The in-app updater polls
# github.com/clout2buy/Ares/releases/latest/download/latest.json, so a new
# release is what the running app sees as "a new update is available".
#
# Every artifact is signed with the Tauri minisign key (TAURI_SIGNING_PRIVATE_KEY
# secret); the app embeds the matching public key and refuses any unsigned or
# tampered update. Bump `version` in tauri/src-tauri/tauri.conf.json before
# tagging — the tag and that version should match.

on:
  push:
    tags:
      - "v*"

# tauri-action needs to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build & publish Windows installer
    # Windows-first shell (WebView2 / windows-sys), and NSIS only builds on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the TS workspace so packages are coherent (parity with the local
      # `desktop:installer` script).
      - name: Build workspace
        run: pnpm build

      # The gate. CI only runs on push/PR to main, so a tag could previously
      # ship an installer that CI would have failed. Tests run here too, before
      # anything is signed or published — a red suite aborts the release.
      # Lower concurrency than CI on purpose. A handful of tests assert on wall
      # clock (Bash timeout, scheduler intervals, daemon/garrison boot) and go
      # flaky under a full 16-way parallel run on a loaded runner — a release
      # gate that fails at random is a gate people learn to bypass. Raise this
      # back to the CI default once those assertions no longer race.
      - name: Test
        run: node --import ./tests/_isolate-home.mjs --test --test-concurrency=2 tests/*.test.mjs

      # Bundle the embedded node + CLI runtime into tauri/src-tauri/runtime/.
      # tauri-build validates this resource path exists at compile time, and the
      # app launches the daemon/Garrison from it.
      - name: Build embedded runtime
        run: pnpm --filter ares-tauri build:runtime

      # Builds the NSIS installer, signs it + emits latest.json, creates the
      # release, and uploads the installer, its .sig, and latest.json.
      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Ares ${{ github.ref_name }}"
          releaseBody: |
            Ares 0.50.0 — Long Haul.

            The coding-reliability release. People said Ares was great at the start of a big project and got worse as the session grew. Forensics over 56 real sessions found why, and this release fixes each cause:

            - Compaction recaps were capped at 2048 tokens and every stored one ended mid-sentence. The summarizer now has a 7k budget and a structured brief (primary request, constraints verbatim, key concepts, files & code, errors & fixes, commands & results, all user messages verbatim, pending tasks, current work, next step). Recaps are also archived under ~/.ares/compactions for inspection.
            - Blind edits after compaction (46 of 49 Edit failures in the field): the recap re-pins the files being edited with their live bytes and names, by path, every file edited in the summarized span that it could NOT pin, with an explicit instruction to Read the region before editing.
            - Prompt growth (50k -> 104k tokens per call over a session): microcompact now clears old Bash/PowerShell/Edit/Write/ApplyPatch/LSP/MCP output, not just Read/Grep; keyed status reminders (coding state, repo map, git delta, recall, oricle) replace their previous copy instead of stacking.
            - Oversized tool results: the spill preview now carries the head AND the tail plus a line count and a tool-specific "ask for less next time" hint; the full output is always on disk.
            - Opus 4.6 sessions bricked by "content[].thinking must be passed back" (19 occurrences): the provider retries once with thinking off and thinking blocks stripped, in the same turn.
            - Silent PowerShell failures (25 of 57 failing shell calls printed nothing): the tool now explains what a silent non-zero exit usually means and how to surface the real error.
            - The context ceiling learned from a refused request is now the refused prompt size, not a fixed rung; tactical reasoning downshifts and stall downgrades are opt-in (ARES_TACTICAL_REASONING=1, ARES_STALL_DOWNGRADE=1).
            - Verification debt no longer blocks a plain question; the post-turn verifier scopes to the last 40 touched files so it finishes inside its settle window.
            - New long-horizon gauntlet test drives a real multi-turn session through microcompact and heavy compaction and asserts every guarantee above.
            - Remote Connect on Mac/Linux: the connector script is pure-stdlib now (no pip install; Homebrew Python's PEP 668 refusal broke connects).
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

  release-linux:
    name: Build & publish Linux installers
    # Runs AFTER Windows so both jobs write into the same release and
    # tauri-action MERGES latest.json (windows + linux updater entries) instead
    # of racing and clobbering each other. The embedded runtime script is
    # platform-aware: on this runner it bundles a Linux node binary.
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # WebKitGTK 4.1 + friends — the Tauri v2 Linux build chain.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libxdo-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      # Same gate as the Windows job — this one runs the suite on Linux.
      # Lower concurrency than CI on purpose. A handful of tests assert on wall
      # clock (Bash timeout, scheduler intervals, daemon/garrison boot) and go
      # flaky under a full 16-way parallel run on a loaded runner — a release
      # gate that fails at random is a gate people learn to bypass. Raise this
      # back to the CI default once those assertions no longer race.
      - name: Test
        run: node --import ./tests/_isolate-home.mjs --test --test-concurrency=2 tests/*.test.mjs

      - name: Build embedded runtime
        run: pnpm --filter ares-tauri build:runtime

      # AppImage feeds the in-app auto-updater (the only Linux format Tauri's
      # updater supports); the .deb is for people who prefer a real install.
      - name: Build, sign, and publish Linux bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Ares ${{ github.ref_name }}"
          releaseBody: |
            Ares 0.50.0 — Long Haul.

            The coding-reliability release. People said Ares was great at the start of a big project and got worse as the session grew. Forensics over 56 real sessions found why, and this release fixes each cause:

            - Compaction recaps were capped at 2048 tokens and every stored one ended mid-sentence. The summarizer now has a 7k budget and a structured brief (primary request, constraints verbatim, key concepts, files & code, errors & fixes, commands & results, all user messages verbatim, pending tasks, current work, next step). Recaps are also archived under ~/.ares/compactions for inspection.
            - Blind edits after compaction (46 of 49 Edit failures in the field): the recap re-pins the files being edited with their live bytes and names, by path, every file edited in the summarized span that it could NOT pin, with an explicit instruction to Read the region before editing.
            - Prompt growth (50k -> 104k tokens per call over a session): microcompact now clears old Bash/PowerShell/Edit/Write/ApplyPatch/LSP/MCP output, not just Read/Grep; keyed status reminders (coding state, repo map, git delta, recall, oricle) replace their previous copy instead of stacking.
            - Oversized tool results: the spill preview now carries the head AND the tail plus a line count and a tool-specific "ask for less next time" hint; the full output is always on disk.
            - Opus 4.6 sessions bricked by "content[].thinking must be passed back" (19 occurrences): the provider retries once with thinking off and thinking blocks stripped, in the same turn.
            - Silent PowerShell failures (25 of 57 failing shell calls printed nothing): the tool now explains what a silent non-zero exit usually means and how to surface the real error.
            - The context ceiling learned from a refused request is now the refused prompt size, not a fixed rung; tactical reasoning downshifts and stall downgrades are opt-in (ARES_TACTICAL_REASONING=1, ARES_STALL_DOWNGRADE=1).
            - Verification debt no longer blocks a plain question; the post-turn verifier scopes to the last 40 touched files so it finishes inside its settle window.
            - New long-horizon gauntlet test drives a real multi-turn session through microcompact and heavy compaction and asserts every guarantee above.
            - Remote Connect on Mac/Linux: the connector script is pure-stdlib now (no pip install; Homebrew Python's PEP 668 refusal broke connects).
          releaseDraft: false
          prerelease: false
          args: --bundles appimage,deb
