[package]
name = "ares-tauri"
version = "0.69.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" = multi-webview: the Forge's native browser view is a child
# webview of the main window (src/forge_view.rs).
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only shell affordances (DWM dark titlebar, ShellExecute). Everything
# that uses these is #[cfg(windows)]-guarded, so Linux/macOS builds skip them.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
